<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Fixed Cal">
    <meta name="theme-color" content="#059669">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3652/3652191.png">

    <title>Fixed Calendar - Jan Start</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap');
        
        body { 
            font-family: 'Outfit', sans-serif; 
            background-color: #f8fafc; 
            -webkit-tap-highlight-color: transparent; 
        }
        
        .no-select { user-select: none; -webkit-user-select: none; }
        
        .fade-in-up { animation: fadeInUp 0.5s ease-out forwards; opacity: 0; transform: translateY(15px); }
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
        
        .today-pulse { 
            animation: today-glow 2s infinite; 
            z-index: 10; 
            background-color: #10b981 !important; 
            color: white !important; 
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4); 
        }
        @keyframes today-glow { 
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6); } 
            70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); } 
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } 
        }

        .digital-font { font-family: 'Space Mono', monospace; }
        
        .has-reminder::after {
            content: '';
            position: absolute;
            bottom: 4px;
            width: 4px;
            height: 4px;
            background-color: #3b82f6;
            border-radius: 50%;
        }

        /* Modal styling */
        .modal-enter { animation: modalIn 0.3s ease-out forwards; }
        @keyframes modalIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-20 relative no-select">

    <header class="bg-white/90 shadow-sm sticky top-0 z-40 backdrop-blur-md border-b border-slate-200 pt-safe-top">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-gradient-to-br from-blue-500 to-emerald-600 text-white p-2 rounded-xl shadow-md">
                    <i class="fa-solid fa-calendar-days text-lg"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold bg-clip-text text-transparent bg-gradient-to-r from-slate-800 to-slate-600 leading-tight">Fixed Cal</h1>
                    <p class="text-[10px] text-slate-500 font-bold uppercase">Jan-Dec Cycle</p>
                </div>
            </div>
            <button id="settings-toggle" class="bg-white border border-slate-200 hover:bg-slate-50 text-slate-600 p-2 rounded-xl active:scale-95 transition-transform">
                <i class="fa-solid fa-gear"></i>
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6">
        
        <!-- Dashboard -->
        <div class="mb-8 bg-slate-900 rounded-3xl p-6 text-white shadow-xl relative overflow-hidden fade-in-up">
            <div class="relative z-10 flex flex-col gap-4">
                <div class="flex justify-between items-start">
                    <div>
                        <div class="text-slate-400 text-[10px] font-bold uppercase tracking-wider mb-1">Current Date</div>
                        <div id="live-gregorian-date" class="text-emerald-400 text-lg font-bold">Connecting...</div>
                        <div id="live-time" class="text-2xl font-bold digital-font text-white opacity-80">00:00</div>
                    </div>
                    <div class="text-right">
                        <div class="text-slate-400 text-[10px] font-bold uppercase tracking-wider mb-1">Fixed System</div>
                        <div class="flex items-baseline justify-end gap-1">
                            <span id="live-fixed-month" class="text-xl font-bold">---</span>
                            <span id="live-fixed-day" class="text-xl font-bold text-emerald-400">---</span>
                        </div>
                        <div id="live-fixed-weekday" class="text-xs text-amber-400 font-bold mt-1">---</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Legend -->
        <div class="flex flex-wrap gap-3 mb-6 px-1">
            <div class="flex items-center gap-1.5 bg-white px-2 py-1 rounded-md border border-slate-100 shadow-sm">
                <span class="w-2 h-2 rounded-full bg-blue-500"></span>
                <span class="text-[10px] font-bold text-slate-600">Reminder</span>
            </div>
            <div class="flex items-center gap-1.5 bg-white px-2 py-1 rounded-md border border-slate-100 shadow-sm">
                <span class="w-2 h-2 rounded-full bg-amber-400"></span>
                <span class="text-[10px] font-bold text-slate-600">Poya</span>
            </div>
        </div>

        <!-- Calendar Grid -->
        <div id="calendar-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
        
        <!-- Year Day (365th) -->
        <div id="year-day-container" class="mt-8"></div>
    </main>

    <!-- Reminder Modal -->
    <div id="reminder-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 hidden">
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" id="modal-overlay"></div>
        <div class="bg-white w-full max-w-sm rounded-3xl p-6 relative z-10 modal-enter shadow-2xl">
            <h3 id="modal-date-title" class="font-bold text-slate-800 text-lg mb-1">Add Reminder</h3>
            <p id="modal-date-subtitle" class="text-xs text-slate-500 mb-4 font-medium italic"></p>
            <textarea id="reminder-text" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:ring-2 focus:ring-emerald-500 outline-none mb-4" rows="3" placeholder="What's happening?"></textarea>
            <div class="flex gap-2">
                <button id="save-reminder" class="flex-1 bg-emerald-600 text-white font-bold py-3 rounded-xl active:scale-95 transition-transform">Save</button>
                <button id="delete-reminder" class="px-4 bg-rose-50 text-rose-500 rounded-xl hidden"><i class="fa-solid fa-trash"></i></button>
            </div>
        </div>
    </div>

    <!-- Settings Overlay -->
    <div id="settings-panel" class="fixed top-20 right-4 w-72 bg-white rounded-2xl shadow-2xl border border-slate-100 z-50 transform translate-x-[120%] transition-transform duration-300 p-6 hidden">
        <div class="flex justify-between items-center mb-6">
            <h3 class="font-bold text-slate-800">Settings</h3>
            <button id="close-settings" class="p-2"><i class="fa-solid fa-xmark text-lg text-slate-400"></i></button>
        </div>
        <div class="mb-5">
            <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Cycle Year</label>
            <select id="cycle-select" class="w-full bg-slate-50 border p-2 rounded-lg text-sm font-medium">
                <option value="2025" selected>2025</option>
                <option value="2026">2026</option>
            </select>
        </div>
        <button id="clear-data" class="w-full text-xs text-rose-500 font-bold border border-rose-100 py-2 rounded-lg bg-rose-50 mt-4">Clear All Reminders</button>
    </div>

    <script>
        const months = ["January", "February", "March", "April", "May", "June", "Sol", "July", "August", "September", "October", "November", "December"];
        const dayNames = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
        const dayAbbr = ["S", "M", "T", "W", "T", "F", "S"];
        const START_MONTH_GREGORIAN_INDEX = 0; // JANUARY START

        let state = {
            activeCycleYear: new Date().getFullYear(),
            timeZone: "Asia/Colombo",
            reminders: JSON.parse(localStorage.getItem('fixed-cal-reminders') || '{}'),
            selectedDayKey: null
        };

        // --- CALCULATION LOGIC ---
        function getCycleStartDate(cycleYear) {
            return new Date(Date.UTC(cycleYear, 0, 1, 12, 0, 0));
        }

        function toFixedCalendar(date) {
            const cycleYear = date.getFullYear();
            const start = getCycleStartDate(cycleYear);
            const target = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate(), 12, 0, 0));
            const diffDays = Math.floor((target - start) / (1000 * 60 * 60 * 24)) + 1;
            
            const nextCycleStart = new Date(Date.UTC(cycleYear + 1, 0, 1));
            const daysInYear = Math.round((nextCycleStart - start) / (1000 * 60 * 60 * 24));
            
            if (diffDays === daysInYear) return { cycleYear, monthIndex: 12, day: 29, monthName: "Year Day", isYearDay: true };
            if (diffDays < 1) return null;

            const monthIndex = Math.floor((diffDays - 1) / 28);
            const dayOfMonth = ((diffDays - 1) % 28) + 1;
            const safeMonthIndex = Math.min(monthIndex, 12);

            return { 
                cycleYear, 
                monthIndex: safeMonthIndex, 
                monthName: months[safeMonthIndex], 
                day: dayOfMonth, 
                weekday: dayNames[(dayOfMonth - 1) % 7] 
            };
        }

        function getGregDate(cycleYear, monthIdx, day) {
            const start = getCycleStartDate(cycleYear);
            const target = new Date(start);
            target.setDate(start.getDate() + (monthIdx * 28) + (day - 1));
            return target;
        }

        // --- UI RENDER ---
        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';
            
            let currentMonthId = null;
            const todayFixed = toFixedCalendar(new Date());

            for (let m = 0; m < 13; m++) {
                const startG = getGregDate(state.activeCycleYear, m, 1);
                const endG = getGregDate(state.activeCycleYear, m, 28);
                const rangeStr = `${startG.toLocaleDateString('en-US', {month:'short', day:'numeric'})} - ${endG.toLocaleDateString('en-US', {month:'short', day:'numeric'})}`;

                const card = document.createElement('div');
                card.id = `month-card-${m}`;
                card.className = `bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden fade-in-up`;
                
                if (todayFixed && todayFixed.monthIndex === m && todayFixed.cycleYear === state.activeCycleYear) {
                    currentMonthId = card.id;
                }

                card.innerHTML = `
                    <div class="p-4 ${m === 6 ? 'bg-blue-600 text-white' : 'bg-slate-50 text-slate-800'} border-b flex justify-between items-center">
                        <div>
                            <h3 class="font-bold text-sm">${months[m]}</h3>
                            <div class="text-[9px] opacity-70 font-mono">${rangeStr}</div>
                        </div>
                        <span class="text-[9px] font-bold opacity-60 bg-black/5 px-2 py-0.5 rounded">M${m+1}</span>
                    </div>
                    <div class="p-3">
                        <div class="grid grid-cols-7 mb-2 border-b pb-2">
                            ${dayAbbr.map((d, i) => `<div class="text-center text-[10px] font-bold ${i === 0 ? 'text-rose-500' : 'text-slate-400'}">${d}</div>`).join('')}
                        </div>
                        <div class="grid grid-cols-7 gap-1">
                            ${Array.from({length: 28}, (_, i) => {
                                const d = i + 1;
                                const key = `y${state.activeCycleYear}-m${m}-d${d}`;
                                const hasRem = state.reminders[key] ? 'has-reminder' : '';
                                const isSun = d % 7 === 1 ? 'text-rose-500 font-bold' : 'text-slate-600';
                                return `<div onclick="openReminder('${key}', ${m}, ${d})" class="day-cell relative h-9 flex items-center justify-center text-xs rounded-lg cursor-pointer hover:bg-slate-50 active:scale-90 transition-all ${hasRem}" id="${key}">
                                    <span class="${isSun}">${d}</span>
                                </div>`;
                            }).join('')}
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            }

            // Render Year Day
            const yd = document.getElementById('year-day-container');
            const ydKey = `y${state.activeCycleYear}-m12-d29`;
            yd.innerHTML = `
                <div onclick="openReminder('${ydKey}', 12, 29)" class="bg-slate-900 rounded-2xl p-4 text-white shadow-lg flex items-center justify-between cursor-pointer active:scale-[0.98] transition-all">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-emerald-500/20 rounded-lg flex items-center justify-center text-emerald-400"><i class="fa-solid fa-star"></i></div>
                        <div><h3 class="font-bold text-sm">Year Day (365th)</h3><p class="text-[10px] text-slate-400">Tap to add special reminder</p></div>
                    </div>
                    ${state.reminders[ydKey] ? '<div class="w-2 h-2 bg-blue-500 rounded-full"></div>' : ''}
                </div>`;

            // Auto-scroll to current month
            if (currentMonthId) {
                setTimeout(() => {
                    const el = document.getElementById(currentMonthId);
                    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 500);
            }
        }

        // --- REMINDER SYSTEM ---
        window.openReminder = (key, m, d) => {
            state.selectedDayKey = key;
            const greg = getGregDate(state.activeCycleYear, m, d);
            document.getElementById('modal-date-title').innerText = `${months[m]} ${d}`;
            document.getElementById('modal-date-subtitle').innerText = greg.toLocaleDateString('en-US', { dateStyle: 'full' });
            document.getElementById('reminder-text').value = state.reminders[key] || '';
            document.getElementById('reminder-modal').classList.remove('hidden');
            document.getElementById('delete-reminder').classList.toggle('hidden', !state.reminders[key]);
        };

        document.getElementById('save-reminder').onclick = () => {
            const txt = document.getElementById('reminder-text').value.trim();
            if (txt) state.reminders[state.selectedDayKey] = txt;
            else delete state.reminders[state.selectedDayKey];
            localStorage.setItem('fixed-cal-reminders', JSON.stringify(state.reminders));
            renderCalendar();
            closeModal();
        };

        document.getElementById('delete-reminder').onclick = () => {
            delete state.reminders[state.selectedDayKey];
            localStorage.setItem('fixed-cal-reminders', JSON.stringify(state.reminders));
            renderCalendar();
            closeModal();
        };

        function closeModal() { document.getElementById('reminder-modal').classList.add('hidden'); }
        document.getElementById('modal-overlay').onclick = closeModal;

        // --- UPDATES ---
        function updateClock() {
            const now = new Date();
            document.getElementById('live-time').innerText = now.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit' });
            document.getElementById('live-gregorian-date').innerText = now.toLocaleDateString('en-US', { dateStyle: 'medium' });

            const fixed = toFixedCalendar(now);
            if (fixed) {
                document.getElementById('live-fixed-month').innerText = fixed.monthName;
                document.getElementById('live-fixed-day').innerText = fixed.isYearDay ? "Year Day" : fixed.day;
                document.getElementById('live-fixed-weekday').innerText = fixed.isYearDay ? "Holiday" : fixed.weekday;
                
                const todayKey = `y${fixed.cycleYear}-m${fixed.monthIndex}-d${fixed.day}`;
                document.querySelectorAll('.today-pulse').forEach(el => el.classList.remove('today-pulse'));
                document.getElementById(todayKey)?.classList.add('today-pulse');
            }
        }

        // --- SETTINGS ---
        document.getElementById('settings-toggle').onclick = () => {
            document.getElementById('settings-panel').classList.remove('hidden');
            setTimeout(() => document.getElementById('settings-panel').classList.remove('translate-x-[120%]'), 10);
        };
        document.getElementById('close-settings').onclick = () => {
            document.getElementById('settings-panel').classList.add('translate-x-[120%]');
            setTimeout(() => document.getElementById('settings-panel').classList.add('hidden'), 300);
        };
        document.getElementById('clear-data').onclick = () => {
            if (confirm('Clear all reminders?')) {
                state.reminders = {};
                localStorage.clear();
                renderCalendar();
            }
        };
        document.getElementById('cycle-select').onchange = (e) => {
            state.activeCycleYear = parseInt(e.target.value);
            renderCalendar();
            updateClock();
        };

        // Initialize
        renderCalendar();
        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
